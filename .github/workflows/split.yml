name: Packages Split
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: monorepo-split
  cancel-in-progress: false

jobs:
  split:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - { path: packages/contracts, repo: codeatlas-contracts }
          - { path: packages/core, repo: codeatlas-core }
          - { path: packages/scanner, repo: codeatlas-scanner }
          - { path: packages/analyzers/routes, repo: codeatlas-analyzer-routes }
          - { path: packages/exporters/json, repo: codeatlas-exporter-json }
          - { path: packages/laravel, repo: codeatlas-laravel }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: danharrin/monorepo-split-github-action@v2.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.CODEATLAS_ACCESS_TOKEN }}
        with:
          tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          package_directory: ${{ matrix.package.path }}
          repository_organization: snova-labs
          repository_name: ${{ matrix.package.repo }}
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
